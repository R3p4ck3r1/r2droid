name: Build Android APK

on:
  workflow_dispatch:
    inputs:
      branch:
        description: "Branch to build"
        required: true
        default: "main"
        type: string
      build_type:
        description: "Gradle build type"
        required: true
        default: "debug"
        type: choice
        options:
          - debug
          - release
      flavor:
        description: "Distribution"
        required: true
        default: "full"
        type: choice
        options:
          - full
          - prootOnly
          - both

permissions:
  contents: read

concurrency:
  group: android-build-${{ inputs.branch }}-${{ inputs.build_type }}-${{ inputs.flavor }}
  cancel-in-progress: true

jobs:
  build:
    name: Build ${{ inputs.flavor }} ${{ inputs.build_type }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Checkout selected branch
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.branch }}
          fetch-depth: 1

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Make Gradle wrapper executable
        run: chmod +x gradlew

      - name: Verify Gradle wrapper
        run: ./gradlew --version

      - name: Build selected APKs
        shell: bash
        run: |
          set -euxo pipefail

          case "${{ inputs.flavor }}:${{ inputs.build_type }}" in
            full:debug)
              ./gradlew :app:assembleFullDebug
              ;;
            full:release)
              ./gradlew :app:assembleFullRelease
              ;;
            prootOnly:debug)
              ./gradlew :app:assembleProotOnlyDebug
              ;;
            prootOnly:release)
              ./gradlew :app:assembleProotOnlyRelease
              ;;
            both:debug)
              ./gradlew :app:assembleFullDebug :app:assembleProotOnlyDebug
              ;;
            both:release)
              ./gradlew :app:assembleFullRelease :app:assembleProotOnlyRelease
              ;;
            *)
              echo "Unsupported flavor/build type"
              exit 1
              ;;
          esac

      - name: List APK outputs
        run: |
          find app/build/outputs/apk -type f -name "*.apk" -print | sort

      - name: Upload APKs
        uses: actions/upload-artifact@v7
        with:
          name: R2Droid-${{ inputs.branch }}-${{ inputs.flavor }}-${{ inputs.build_type }}
          path: app/build/outputs/apk/**/*.apk
          if-no-files-found: error
          compression-level: 0
