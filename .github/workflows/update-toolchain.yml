name: Update Android Toolchain

on:
  workflow_dispatch:
    inputs:
      branch:
        description: "Branch to update"
        required: true
        default: "main"
        type: string
      r2_version:
        description: "radare2 release to bundle"
        required: true
        default: "6.2.2"
        type: string
      mode:
        description: "Commit assets to the selected branch or upload only"
        required: true
        default: "artifact"
        type: choice
        options:
          - artifact
          - commit

permissions:
  contents: write

concurrency:
  group: update-toolchain-${{ inputs.branch }}
  cancel-in-progress: true

jobs:
  update:
    name: Update r2 Android arm64 toolchain
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    steps:
      - name: Checkout selected branch
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.branch }}
          fetch-depth: 0

      - name: Install build utilities
        run: |
          set -eux
          sudo apt-get update
          sudo apt-get install -y curl wget tar gzip xz-utils unzip file binutils jq

      - name: Download official radare2 Android arm64 release
        env:
          R2_VERSION: ${{ inputs.r2_version }}
        run: |
          set -euxo pipefail

          URL="https://github.com/radareorg/radare2/releases/download/${R2_VERSION}/radare2-${R2_VERSION}-android-aarch64.tar.gz"
          curl -fL --retry 5 --retry-all-errors \
            "$URL" \
            -o /tmp/radare2-android-aarch64.tar.gz

          if [ "$R2_VERSION" = "6.2.2" ]; then
            EXPECTED="228bf58c44fbd9f3afd37ba545ef73155415150849dbd576ad1fd89789082c9f"
            echo "${EXPECTED}  /tmp/radare2-android-aarch64.tar.gz" | sha256sum -c -
          else
            echo "INFO: No pinned checksum is embedded for r2 ${R2_VERSION}."
            echo "The archive was downloaded over HTTPS from the official radare2 release."
          fi

      - name: Inspect radare2 archive
        run: |
          set -eux
          mkdir -p /tmp/r2
          tar -xzf /tmp/radare2-android-aarch64.tar.gz -C /tmp/r2
          echo "Archive contents:"
          find /tmp/r2 -maxdepth 5 -type f -print | sort | head -300

      - name: Prepare R2Droid bundled assets
        env:
          R2_VERSION: ${{ inputs.r2_version }}
        run: |
          set -euxo pipefail

          # R2Droid documents two bundled archives: r2.tar and r2dir.tar.
          # Keep the downloaded Android distribution intact inside r2.tar.
          rm -rf toolchain/generated
          mkdir -p toolchain/generated

          tar -czf toolchain/generated/r2.tar \
            -C /tmp/r2 .

          cat > toolchain/generated/TOOLCHAIN.txt <<EOF
          R2Droid Android toolchain
          radare2: ${R2_VERSION}
          ABI: aarch64 / arm64-v8a
          Source: https://github.com/radareorg/radare2/releases/tag/${R2_VERSION}
          Generated by .github/workflows/update-toolchain.yml
          EOF

          sha256sum toolchain/generated/r2.tar \
            toolchain/generated/TOOLCHAIN.txt \
            > toolchain/generated/SHA256SUMS

          ls -lh toolchain/generated

      - name: Upload generated toolchain
        uses: actions/upload-artifact@v7
        with:
          name: r2droid-toolchain-${{ inputs.r2_version }}-${{ inputs.branch }}
          path: toolchain/generated/
          if-no-files-found: error
          compression-level: 0

      - name: Commit generated toolchain
        if: ${{ inputs.mode == 'commit' }}
        env:
          BRANCH: ${{ inputs.branch }}
          R2_VERSION: ${{ inputs.r2_version }}
        run: |
          set -eux

          # Never overwrite the application's existing r2dir.tar automatically.
          # The Android r2 archive is committed as an explicit generated asset.
          mkdir -p app/src/full/assets/toolchain
          cp toolchain/generated/r2.tar app/src/full/assets/toolchain/r2.tar
          cp toolchain/generated/TOOLCHAIN.txt app/src/full/assets/toolchain/TOOLCHAIN.txt
          cp toolchain/generated/SHA256SUMS app/src/full/assets/toolchain/SHA256SUMS

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/full/assets/toolchain
          if git diff --cached --quiet; then
            echo "No toolchain changes to commit."
            exit 0
          fi
          git commit -m "toolchain: update radare2 Android ${R2_VERSION}"
          git push origin "HEAD:${BRANCH}"
